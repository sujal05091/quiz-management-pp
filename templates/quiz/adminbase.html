<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz App - Admin</title>
  
  <!-- Space Theme CSS -->
  <link rel="stylesheet" href="{% static 'css/ai-theme.css' %}">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdeerrpr is thare canm u solv be jjskjdsdlivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--space-gradient);
      color: var(--text-primary);
      font-family: 'Roboto', sans-serif;
      overflow-x: hidden;
    }

    .main-wrapper {
      display: flex;
      min-height: 100vh;
      padding-top: 70px;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(13, 17, 38, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .left_area {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    #sidebar_toggle {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    #sidebar_toggle:hover {
      color: var(--text-primary);
      background: rgba(123, 44, 243, 0.1);
    }

    .left_area h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--text-primary);
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 0 10px var(--accent-glow);
      animation: glow 2s ease-in-out infinite;
    }

    .logout_btn {
      padding: 0.7rem 1.5rem;
      background: linear-gradient(45deg, var(--accent), var(--primary));
      border: none;
      border-radius: 10px;
      color: var(--text-primary);
      font-weight: 500;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .logout_btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
      animation: shine 3s ease-in-out infinite;
    }

    .logout_btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px var(--accent-glow);
      color: var(--text-primary);
    }

    .sidebar {
      position: fixed;
      top: 70px;
      left: 0;
      width: 250px;
      height: calc(100vh - 70px);
      background: rgba(13, 17, 38, 0.95);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border-color);
      padding-top: 1rem;
      z-index: 999;
      overflow-y: auto;
      transition: transform 0.3s ease;
    }

    .content {
      flex: 1;
      margin-left: 250px;
      padding: 2rem;
      min-height: calc(100vh - 70px);
      transition: margin-left 0.3s ease;
      position: relative;
    }

    .sidebar a {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      padding: 1rem 2rem;
      margin: 0.5rem 1rem;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .sidebar a::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar a:hover {
      color: var(--text-primary);
      transform: translateX(5px);
    }

    .sidebar a:hover::before {
      opacity: 0.1;
    }

    .sidebar i {
      margin-right: 1rem;
      width: 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .profile-section {
      text-align: center;
      padding: 2rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      animation: fadeInDown 0.5s ease;
    }

    .profile_image {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transition: all 0.3s ease;
      animation: float 3s ease-in-out infinite;
    }

    .profile_image:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--accent-glow);
    }

    .profile-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--text-primary);
      font-size: 1.2rem;
      margin: 0.5rem 0;
      letter-spacing: 1px;
      animation: fadeIn 0.5s ease 0.2s both;
    }

    .profile-role {
      color: var(--accent);
      font-size: 0.9rem;
      letter-spacing: 1px;
      animation: fadeIn 0.5s ease 0.4s both;
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
      50% { text-shadow: 0 0 20px var(--accent-glow), 0 0 30px var(--accent-glow); }
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      50% { transform: translateX(100%) rotate(45deg); }
      100% { transform: translateX(-100%) rotate(45deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-link {
      animation: slideIn 0.5s ease backwards;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }

      .content {
        margin-left: 0;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .content.active {
        margin-left: 250px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="left_area">
        <button class="btn" id="sidebar_toggle">
          <i class="fas fa-bars"></i>
        </button>
        <h3>Quiz <span style="color: var(--accent)">App</span></h3>
      </div>
      <div class="right_area">
        <a href="/logout" class="logout_btn">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </header>

  <div class="main-wrapper">
    <div class="sidebar">
      <div class="profile-section">
        <img src="{% static 'image/admin.png' %}" class="profile_image" alt="">
        <h4 class="profile-title">{{request.user.first_name}}</h4>
        <p class="profile-role">Administrator</p>
      </div>

      <a href="/admin-dashboard" class="nav-link" style="animation-delay: 0.1s">
        <i class="fas fa-tachometer-alt"></i>
        <span>Dashboard</span>
      </a>
      <a href="/admin-teacher" class="nav-link" style="animation-delay: 0.2s">
        <i class="fas fa-chalkboard-teacher"></i>
        <span>Teacher</span>
      </a>
      <a href="/admin-student" class="nav-link" style="animation-delay: 0.3s">
        <i class="fas fa-user-graduate"></i>
        <span>Student</span>
      </a>
      <a href="/admin-course" class="nav-link" style="animation-delay: 0.4s">
        <i class="fas fa-book"></i>
        <span>Course</span>
      </a>
      <a href="/admin-question" class="nav-link" style="animation-delay: 0.5s">
        <i class="fas fa-question-circle"></i>
        <span>Questions</span>
      </a>
    </div>

    <div class="content">
      {% block content %}
      {% endblock content %}
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/ai-theme.js' %}"></script>

  <script>
    document.getElementById('sidebar_toggle').addEventListener('click', function() {
      document.querySelector('.sidebar').classList.toggle('active');
      document.querySelector('.content').classList.toggle('active');
    });

    // Add active class to current nav link
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.getAttribute('href') === currentPath) {
        link.style.background = 'linear-gradient(45deg, rgba(123, 44, 243, 0.1), transparent)';
        link.style.color = 'var(--text-primary)';
      }
    });
  </script>
</body>

</html>
